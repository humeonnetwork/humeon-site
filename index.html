<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Humeon Partners</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#f5f5f7;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#222;

      animation: fadeIn 1.5s ease;
    }

    .container{
      display:flex;
      align-items:center;
      gap:80px;
      padding:40px;
    }

    .logo-card{
      background:white;
      padding:40px;
      border-radius:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);

      animation: float 4s ease-in-out infinite;
    }

    .logo-card img{
      width:320px;
      display:block;
    }

    .content{
      max-width:500px;
    }

    h1{
      font-size:58px;
      margin-bottom:12px;
      color:#333;
      font-weight:700;
      letter-spacing:1px;
    }

    .tagline{
      font-size:22px;
      color:#5b4dff;
      margin-bottom:40px;
      font-weight:600;
    }

    .description{
      font-size:22px;
      line-height:1.7;
      color:#555;
      margin-bottom:30px;
    }

    .email{
      font-size:22px;
      font-weight:600;
    }

    .email a{
      color:#5b4dff;
      text-decoration:none;
      transition:0.3s;
    }

    .email a:hover{
      opacity:0.7;
    }

    .linkedin{
      margin-top:35px;
    }

    .linkedin a{
      text-decoration:none;
      color:#5b4dff;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
    }

    .linkedin a:hover{
      opacity:0.7;
    }

    @media(max-width:900px){

      .container{
        flex-direction:column;
        text-align:center;
        gap:40px;
      }

      h1{
        font-size:42px;
      }

      .logo-card img{
        width:240px;
      }

      .description{
        font-size:18px;
      }

    }

    @keyframes float {

      0%{
        transform: translateY(0px);
      }

      50%{
        transform: translateY(-10px);
      }

      100%{
        transform: translateY(0px);
      }

    }

    @keyframes fadeIn {

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo-card">
      <img src="logo.png" alt="HUMEON Partners Logo">
    </div>

    <div class="content">

      <h1>HUMEON Partners</h1>

      <div class="tagline">
        Workforce & Business Operations
      </div>

      <div class="description">
        Our website is currently under development.
        <br><br>
        For business inquiries, please contact us below.
      </div>

      <div class="email">
        <a href="mailto:hello@humeonpartners.com">
          hello@humeonpartners.com
        </a>
      </div>

      <div class="linkedin">
        <a href="#">
          LinkedIn
        </a>
      </div>

    </div>

  </div>

</body>

</html>
